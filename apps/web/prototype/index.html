<title>HeAlthFintel Outreach Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Düzen: sol menü + üst başlık çubuğu + içerik. Kampanya sayfası sekmelidir (Akış, Hedefleme, Kişiler, Mesajlar, Sonuçlar). */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --sunk:#eef0ec; --line:#dfe2dc; --line-strong:#c9cdc4;
  --fg:#1c211d; --muted:#5f6760; --faint:#8a918a;
  --accent:#145c52; --accent-hover:#0f4a42; --accent-soft:#e2efec; --on-accent:#ffffff;
  --good:#1d6b3e; --good-soft:#e1f1e6; --warn:#8a5a00; --warn-soft:#f8ecd2; --bad:#a3271f; --bad-soft:#f8e1de; --info:#2b5a8a; --info-soft:#e3ecf6;
  --add:#d8eedd; --del:#f6dcd8; --mine:#e2efec;
  --sans:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121513; --surface:#191d1a; --sunk:#202521; --line:#2c322d; --line-strong:#3a413b;
  --fg:#e6ebe6; --muted:#a2aba3; --faint:#7d867e;
  --accent:#5cc2b0; --accent-hover:#79d1c1; --accent-soft:#1c3531; --on-accent:#0c1f1c;
  --good:#6bd394; --good-soft:#18331f; --warn:#e8b04f; --warn-soft:#382a11; --bad:#ff8f84; --bad-soft:#3d1d1a; --info:#8db8e8; --info-soft:#1b2a3b;
  --add:#1b3a24; --del:#42211d; --mine:#1c3531; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121513; --surface:#191d1a; --sunk:#202521; --line:#2c322d; --line-strong:#3a413b;
  --fg:#e6ebe6; --muted:#a2aba3; --faint:#7d867e;
  --accent:#5cc2b0; --accent-hover:#79d1c1; --accent-soft:#1c3531; --on-accent:#0c1f1c;
  --good:#6bd394; --good-soft:#18331f; --warn:#e8b04f; --warn-soft:#382a11; --bad:#ff8f84; --bad-soft:#3d1d1a; --info:#8db8e8; --info-soft:#1b2a3b;
  --add:#1b3a24; --del:#42211d; --mine:#1c3531; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
/* sol menü */
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:15px}
.logo i{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--on-accent);font:700 13px var(--sans);font-style:normal}
.nav-group{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav:hover{background:var(--sunk);color:var(--fg)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 10px 4px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
/* üst çubuk */
.top{display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,32px);border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.crumbs{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;min-width:0}
.crumbs b{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs button{border:0;background:none;padding:0;color:var(--muted)}
.crumbs button:hover{color:var(--accent)}
.top .spacer{flex:1}
.sample{font-size:12px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:20px;padding:2px 10px;white-space:nowrap}
main{padding-block:24px 64px;padding-inline:clamp(16px,3vw,32px);min-width:0;max-width:1280px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
.lede{color:var(--muted);margin:0 0 20px;max-width:72ch}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:16px}
.card-b.tight{padding:0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.kpi{padding:14px 16px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font:500 24px var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
th.num{font-family:var(--sans)}
.scroll{overflow-x:auto}
.sub{color:var(--muted);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:4px;padding:1px 7px;white-space:nowrap;border:1px solid transparent}
.t-good{background:var(--good-soft);color:var(--good)}.t-warn{background:var(--warn-soft);color:var(--warn)}.t-bad{background:var(--bad-soft);color:var(--bad)}.t-info{background:var(--info-soft);color:var(--info)}.t-acc{background:var(--accent-soft);color:var(--accent)}.t-mute{background:var(--sunk);color:var(--muted)}
.badge{font:500 11px var(--mono);background:var(--sunk);color:var(--muted);border-radius:10px;padding:1px 7px}
.badge.on{background:var(--accent);color:var(--on-accent)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.quiet:hover{color:var(--accent);background:var(--sunk)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn.danger:hover{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:500}
.link:hover{text-decoration:underline}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.list>li:last-child{border-bottom:0}
.time{font:500 12px var(--mono);color:var(--faint);min-width:42px;padding-top:1px}
.attn{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line)}
.attn:last-child{border-bottom:0}
.attn .stripe{width:3px;align-self:stretch;border-radius:2px;flex:none}
.attn p{margin:2px 0 0;color:var(--muted)}
/* sekmeler */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 20px;overflow-x:auto}
.tab{border:0;background:none;padding:9px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13px;font-weight:600}
.help{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=search],select,textarea{border:1px solid var(--line-strong);border-radius:6px;padding:7px 10px;background:var(--surface);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{min-height:200px;resize:vertical;line-height:1.55}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:2px 4px 2px 8px;font-size:13px}
.chip button{border:0;background:none;padding:0 4px;color:var(--faint);font-size:15px;line-height:1}
.chip button:hover{color:var(--bad)}
.chip.ex{background:var(--bad-soft);border-color:transparent}
.add{display:flex;gap:6px;margin-top:8px;max-width:340px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{margin-top:3px;accent-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
/* akış */
.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lane h3{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.lane .sub{margin-bottom:12px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px}
.step .ic{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font:600 12px var(--mono);color:var(--muted);background:var(--surface)}
.step.key{border-color:var(--accent)}
.step.key .ic{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.wait{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;padding:6px 0 6px 14px;border-left:2px dashed var(--line-strong);margin-left:13px}
.file{display:inline-flex;gap:6px;align-items:center;font-size:12px;background:var(--info-soft);color:var(--info);border-radius:4px;padding:2px 8px;margin-top:6px}
/* mesaj düzenleyici */
.editor{display:grid;grid-template-columns:240px minmax(0,1fr) minmax(0,.9fr);gap:16px;align-items:start}
.steplist{display:flex;flex-direction:column;gap:2px}
.steplist .grp{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
.steplist button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px}
.steplist button span{font-size:12px;color:var(--muted)}
.steplist button:hover{background:var(--sunk)}
.steplist button[aria-current="true"]{background:var(--accent-soft)}
.steplist button[aria-current="true"] b{color:var(--accent)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.over{color:var(--bad);font-weight:600}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.var{font:500 12px var(--mono);border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:var(--sunk)}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:7px}
.checks li{display:flex;gap:8px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}.dot.warn{background:var(--warn)}
.bubble{background:var(--sunk);border-radius:10px;padding:12px 14px;white-space:pre-wrap;font-size:14px}
.preview-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.diff{white-space:pre-wrap;line-height:1.6}
.diff del{background:var(--del);text-decoration:line-through}
.diff ins{background:var(--add);text-decoration:none}
.sugg{border:1px solid var(--line-strong);border-radius:6px;padding:12px;margin-top:12px}
.sugg+.sugg{margin-top:8px}
/* gelen kutusu */
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:520px}
.convs{border-right:1px solid var(--line)}
.conv{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px}
.conv:hover{background:var(--sunk)}
.conv[aria-current="true"]{background:var(--accent-soft)}
.convs{min-width:0}
.conv .snip{display:block;max-width:100%;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;gap:8px;padding:16px}
.msg{max-width:min(560px,88%);padding:10px 12px;border-radius:10px;white-space:pre-wrap}
.msg.them{background:var(--sunk);align-self:flex-start}
.msg.me{background:var(--mine);align-self:flex-end}
.msg small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
/* süreç panosu */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:220px}
.col h3{display:flex;justify-content:space-between;font-size:13px;padding:2px 4px}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px}
.deal p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.win{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-strong);border-radius:6px;padding:2px 4px 2px 6px;background:var(--surface)}
.win input{width:54px;border:0;padding:3px 2px;background:none;font-family:var(--mono);font-size:13px;text-align:center}
.win input:focus{outline:2px solid var(--accent-soft)}
.win button{border:0;background:none;color:var(--faint);padding:0 4px;font-size:15px}
.win button:hover{color:var(--bad)}
table.sched td{vertical-align:middle}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:6px;font-weight:500;max-width:calc(100% - 32px);z-index:20}
.login{max-width:380px;margin:10vh auto;padding-inline:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.upload{border:1px dashed var(--line-strong);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
@media (max-width:1100px){.editor{grid-template-columns:200px minmax(0,1fr)}.editor>.side-col{grid-column:1/-1}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .logo{padding:4px 8px}.nav-group,.side-foot{display:none}.nav{white-space:nowrap;width:auto}
  .top{position:static}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2,.g-main,.flow,.editor,.inbox{grid-template-columns:minmax(0,1fr)}
  .convs{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:no-preference){.nav,.btn,.tab{transition:background .12s,color .12s,border-color .12s}}
</style>

<div class="app" id="app">
  <nav class="side" aria-label="Ana menü" id="side">

<script>
/* ===== Örnek veri: gerçek kişiler değildir ===== */
const LINK="https://www.healthfintel.com.tr/";
const settings={banned:["öğrenmek isterim","bağlantıda kalmak isterim","20 dakika"],excluded:["Acıbadem","Eğitim ve Araştırma Hastaneleri","Devlet hastaneleri"],retention:12,quiet:["2026-03-20","2026-05-27"]};
const files=[
  {id:"f1",name:"HeAlthFintel-Hastaneler-Tanitim.pdf",size:"1,2 MB",pages:2,used:"Özel hastaneler · Kabulde mesaj"},
  {id:"f2",name:"HeAlthFintel-Klinikler-Gorunurluk.pdf",size:"0,9 MB",pages:1,used:"—"},
  {id:"f3",name:"HeAlthFintel-Sigorta-Dogrulama.pdf",size:"1,4 MB",pages:2,used:"—"}
];
const STEP_LABEL={invite:"Davet notu",accepted:"Kabulde mesaj",fu1:"1. takip",fu2:"2. takip",conn:"Bağlantıya ilk mesaj",cfu1:"Takip"};
const STEP_KIND={invite:"invite",accepted:"message",fu1:"message",fu2:"message",conn:"message",cfu1:"message"};
function tpl(seg){
  const prod={hastane:"özel hastanelerde hasta kabul ve sigorta doğrulamayı hızlandıran",klinik:"özel kliniklerin sigortalı hastalara görünür olmasını sağlayan",sigorta:"sağlık sigortalarında poliçe doğrulama ve talep süreçlerini hızlandıran"}[seg];

function rules(text,kind){
  const low=text.toLocaleLowerCase("tr-TR");const out=[];
  const b=settings.banned.find(p=>low.includes(p.toLocaleLowerCase("tr-TR")));
  out.push({ok:!b,msg:b?`Yasak ifade: "${b}"`:"Yasak ifade yok"});
  const x=settings.excluded.find(c=>low.includes(c.toLocaleLowerCase("tr-TR")));
  out.push({ok:!x,msg:x?`Hariç tutulan kurum geçiyor: ${x}`:"Hariç tutulan kurum geçmiyor"});
  out.push({ok:/\{hitap\}/.test(text),msg:"Kişiye adıyla hitap ediliyor"});
  const bad=[...text.matchAll(/\{([a-z_]+)\}/g)].map(m=>m[1]).filter(k=>!["hitap","kurum"].includes(k));
  out.push({ok:!bad.length,msg:bad.length?`Tanımsız değişken: {${bad[0]}}`:"Değişkenler tanımlı"});
  out.push({ok:!/\d+\s*(dk|dakika)/i.test(text),msg:"Görüşme için süre yazılmamış"});
  if(kind==="invite"){const n=fill(text,{hitap:"Elif Demirtaş"}).length;out.push({ok:n<=300,msg:`Davet notu ${n}/300 karakter`})}
  else out.push({ok:text.includes(LINK),msg:"Web sitesi linki var"});
  return out;
}
function wordDiff(a,b){
  const A=a.split(/(\s+)/),B=b.split(/(\s+)/);const n=A.length,m=B.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,o="";while(i<n&&j<m){if(A[i]===B[j]){o+=esc(A[i]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){o+=`<del>${esc(A[i])}</del>`;i++}else{o+=`<ins>${esc(B[j])}</ins>`;j++}}
  while(i<n)o+=`<del>${esc(A[i++])}</del>`;while(j<m)o+=`<ins>${esc(B[j++])}</ins>`;return o;
}

/* ===== davet zamanlaması (packages/core/schedule.ts ile aynı kurallar) ===== */
const DAYS=["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"]; // ekranda Pazartesi başlar
const W=(a,b)=>({a,b});
const sched={weekly:180,mode:"auto",gapMin:4,gapMax:20,days:[
  {on:true,w:[W("09:00","12:00"),W("13:30","18:30")]},{on:true,w:[W("09:00","12:00"),W("13:30","18:30")]},{on:true,w:[W("09:00","12:00"),W("13:30","18:30")]},
  {on:true,w:[W("09:00","12:00"),W("13:30","18:30")]},{on:true,w:[W("09:00","12:00"),W("13:30","17:00")]},{on:true,w:[W("10:00","14:00")],inv:15},{on:false,w:[W("10:00","14:00")]}]};
const tmin=s=>{const m=String(s).trim().match(/^(\d{1,2})[:.](\d{2})$/);if(!m)return null;const h=+m[1],n=+m[2];return h<24&&n<60?h*60+n:null};
const SAFE={weekly:200,warn:40,max:60};
function plan(){
  const out=new Array(7).fill(0);let fixed=0;const auto=[];
  sched.days.forEach((d,i)=>{if(!d.on||!d.w.length)return;if(sched.mode==="manual"||d.inv!=null){const v=Math.max(0,Math.min(SAFE.max,Math.round(d.inv??0)));out[i]=v;fixed+=v}else auto.push(i)});
  const rest=Math.max(0,sched.weekly-fixed);const base=auto.length?Math.floor(rest/auto.length):0;let extra=rest-base*auto.length;
  auto.forEach(i=>{out[i]=base+(extra>0?1:0);if(extra>0)extra--});return out;
}
function schedIssues(){
  const iss=[];const p=plan();const avg=(sched.gapMin+sched.gapMax)/2;
  if(sched.mode==="auto"&&sched.weekly>SAFE.weekly)iss.push(["error",`Haftalık hedef ${SAFE.weekly}'ü geçemez; LinkedIn hesabı kısıtlayabilir.`]);
  sched.days.forEach((d,i)=>{if(!d.on)return;const n=DAYS[i];
    if(!d.w.length)iss.push(["error",`${n}: açık ama saat aralığı yok.`]);
    const ws=d.w.map(x=>({s:tmin(x.a),e:tmin(x.b)}));
    if(ws.some(x=>x.s==null||x.e==null))iss.push(["error",`${n}: saatleri SS:DD biçiminde yazın.`]);
    else{ws.sort((x,y)=>x.s-y.s);ws.forEach((x,k)=>{if(x.e<=x.s)iss.push(["error",`${n}: bitiş saati başlangıçtan sonra olmalı.`]);if(k&&x.s<ws[k-1].e)iss.push(["error",`${n}: saat aralıkları çakışıyor.`])});
      const mins=ws.reduce((t,x)=>t+Math.max(0,x.e-x.s),0);const fits=Math.floor(mins/avg);if(p[i]>fits)iss.push(["warning",`${n}: ${p[i]} davet bu saatlere sığmaz (en fazla ~${fits}).`])}
    if((d.inv??0)>SAFE.max)iss.push(["error",`${n}: günlük en fazla ${SAFE.max} davet.`]);else if(p[i]>SAFE.warn)iss.push(["warning",`${n}: ${p[i]} davet; günde ${SAFE.warn}'ın üstü hesabı riske atabilir.`]);
  });
  const tot=p.reduce((a,b)=>a+b,0);
  if(tot>SAFE.weekly)iss.push(["error",`Haftalık toplam ${tot}; ${SAFE.weekly}'ü geçemez.`]);
  else if(sched.mode==="auto"&&tot<sched.weekly)iss.push(["warning",`Günlük hedeflerin toplamı ${tot}; haftalık hedef ${sched.weekly}'e ulaşılmaz.`]);
  return iss;
}
function scheduleCard(){
  const p=plan(),tot=p.reduce((a,b)=>a+b,0),iss=schedIssues(),err=iss.some(x=>x[0]==="error");
  return `<div class="card"><div class="card-h"><div><h2>Davet zamanlaması · Furkan Kurtoğlu</h2><span class="sub">Hangi gün, hangi saatlerde, kaç davet gideceğini belirleyin. Mesajlar da aynı saatlerde gönderilir.</span></div>
    <div class="row"><button class="btn sm" data-preset="weekdays">Hafta içi</button><button class="btn sm" data-preset="all">Her gün</button><button class="btn sm" data-preset="copy">Pazartesiyi tüm açık günlere uygula</button></div></div>
  <div class="card-b stack">
    <div class="row" style="gap:20px;align-items:flex-end">
      <div class="field"><span class="lbl">Hedef</span><div class="seg" role="group" aria-label="Hedef türü"><button aria-pressed="${sched.mode==="auto"}" data-smode="auto">Haftalık hedef</button><button aria-pressed="${sched.mode==="manual"}" data-smode="manual">Gün gün hedef</button></div></div>
      ${sched.mode==="auto"?`<div class="field"><label for="wk">Haftalık davet</label><input type="number" id="wk" min="0" max="200" value="${sched.weekly}" style="width:110px"></div><p class="help" style="margin:0 0 6px;max-width:44ch">Gün hedefi boş bırakılan açık günler haftalık hedeften eşit pay alır. LinkedIn sınırı haftada yaklaşık 200.</p>`:`<p class="help" style="margin:0 0 6px;max-width:52ch">Her günün davet sayısını siz belirlersiniz. Haftalık toplam 200'ü geçemez.</p>`}
      <div style="margin-left:auto;text-align:right"><div class="sub">Haftalık toplam</div><div style="font:500 22px var(--mono)">${tot}</div></div>
    </div>
    <div class="scroll"><table class="sched"><thead><tr><th>Gün</th><th>Açık</th><th class="num">Davet</th><th>Saat aralıkları</th></tr></thead><tbody>
    ${sched.days.map((d,i)=>`<tr><td><b>${DAYS[i]}</b></td><td><input type="checkbox" id="on${i}" data-don="${i}" ${d.on?"checked":""} aria-label="${DAYS[i]} açık" style="accent-color:var(--accent);width:16px;height:16px"></td>
      <td class="num">${d.on?`<input type="number" min="0" max="60" data-dinv="${i}" value="${sched.mode==="manual"||d.inv!=null?(d.inv??0):""}" placeholder="${p[i]}" style="width:76px;text-align:right" aria-label="${DAYS[i]} davet hedefi">${sched.mode==="auto"&&d.inv==null?`<div class="sub">otomatik</div>`:sched.mode==="auto"?`<div class="sub"><button class="link" style="font-size:12px" data-dauto="${i}">otomatiğe al</button></div>`:""}`:`<span class="sub">0</span>`}</td>
      <td>${d.on?`<div class="row" style="gap:6px">${d.w.map((w,k)=>`<span class="win"><input type="text" value="${w.a}" data-wa="${i}-${k}" aria-label="${DAYS[i]} başlangıç ${k+1}" inputmode="numeric"><span>–</span><input type="text" value="${w.b}" data-wb="${i}-${k}" aria-label="${DAYS[i]} bitiş ${k+1}" inputmode="numeric"><button aria-label="Aralığı sil" data-wdel="${i}-${k}">×</button></span>`).join("")}${d.w.length<3?`<button class="btn sm quiet" data-wadd="${i}">Aralık ekle</button>`:""}</div>`:`<span class="sub">Gönderim yok</span>`}</td></tr>`).join("")}
    </tbody></table></div>
    ${iss.length?`<ul class="checks">${iss.map(x=>`<li><span class="dot ${x[0]==="error"?"no":"warn"}"></span>${esc(x[1])}</li>`).join("")}</ul>`:`<ul class="checks"><li><span class="dot ok"></span>Ayarlar güvenli aralıkta.</li></ul>`}
    <div class="row"><button class="btn primary" id="saveSched" ${err?"disabled":""}>Kaydet</button>${err?`<span class="help">Kaydetmek için kırmızı işaretli sorunları düzeltin.</span>`:`<span class="help">Resmî tatillerde ve Ayarlar'daki özel günlerde gönderim yapılmaz.</span>`}</div>
  </div></div>`;
}
function rerenderSchedule(focusSel){
  const pos=document.activeElement&&document.activeElement.selectionStart;render();
  if(focusSel){const el=document.querySelector(focusSel);if(el){el.focus();try{if(pos!=null&&el.setSelectionRange)el.setSelectionRange(pos,pos)}catch(e){}}}
}

V.settings=()=>`<h1>Ayarlar</h1><p class="lede">Tüm kampanyalar için geçerli kurallar, KVKK, yardımcı araçlar ve bildirimler.</p>
  <div class="grid g2"><div class="stack">
    <div class="card"><div class="card-h"><h2>Hariç tutma listesi</h2></div><div class="card-b"><p class="help" style="margin:0 0 10px">Bu kurumlardaki kimseye ulaşılmaz; kurum adı bir mesajda geçerse mesaj durdurulur.</p>${chipList(settings.excluded,"excluded",true)}</div></div>
    <div class="card"><div class="card-h"><h2>Yasak ifadeler</h2></div><div class="card-b">${chipList(settings.banned,"banned",true)}</div></div>
    <div class="card"><div class="card-h"><h2>Gönderim yapılmayacak günler</h2></div><div class="card-b"><p class="help" style="margin:0 0 10px">Sabit resmî tatiller otomatik. Dinî bayramları her yıl ekleyin.</p>${chipList(settings.quiet,"quiet")}</div></div>
    <div class="card"><div class="card-h"><h2>Ekip</h2></div><div class="card-b tight"><table><tbody><tr><td>Furkan Kurtoğlu</td><td class="sub">Sahip</td></tr></tbody></table><form class="add" data-invite="1" style="padding:0 16px 16px"><input type="email" id="inv" placeholder="E-posta ile davet et" aria-label="Davet e-postası"><button class="btn sm">Davet et</button></form></div></div>
  </div><div class="stack">
    <div class="card"><div class="card-h"><h2>KVKK</h2></div><div class="card-b stack">
      <div class="field"><label for="pn">Aydınlatma metni adresi</label><input type="text" id="pn" value="${LINK}kvkk-iletisim"></div>
      <div class="field"><label for="ret">Cevap vermeyenlerin verisi silinsin</label><select id="ret">${[6,12,24].map(m=>`<option ${m===settings.retention?"selected":""} value="${m}">${m} ay sonra</option>`).join("")}</select></div>
      <div class="row"><button class="btn danger" data-toast="Kişi silindi; tekrar bulunmaması için yalnızca profil linkinin özeti tutuluyor">Silme talebi işle</button></div></div></div>
    <div class="card"><div class="card-h"><h2>Düzenleme yardımı</h2><span class="tag t-mute">İsteğe bağlı</span></div><div class="card-b stack">
      <p class="help" style="margin:0">Mesaj taslakları, kural denetimi, kişi puanlama, cevap etiketleme ve sonuç karşılaştırması bu anahtar olmadan çalışır.</p>
      <div class="field"><label for="gk">Gemini API anahtarı</label><input type="password" id="gk" placeholder="Google AI Studio'dan ücretsiz alınır"><span class="help">Yalnızca "Netleştir, Kısalt, 3 alternatif" düğmeleri için. Gönderilen tek şey şablon metnidir; kişi bilgisi gönderilmez. Günlük ücretsiz hak dolarsa düğmeler ertesi güne kadar kapanır.</span></div></div></div>
    <div class="card"><div class="card-h"><h2>Bildirimler</h2></div><div class="card-b">
      <label class="check"><input type="checkbox" checked id="n1"><span>Yeni cevap ve onay bekleyen mesaj · e-posta</span></label>
      <label class="check"><input type="checkbox" id="n2"><span>Telegram</span></label>
      <label class="check"><input type="checkbox" checked id="n3"><span>Günlük özet · 18:45</span></label></div></div>
  </div></div>`;

/* ===== çizim ===== */
function render(){
  const login=S.view==="login";
  $("#side").hidden=login;$("#top").hidden=login;$("#app").style.gridTemplateColumns=login?"1fr":"";
  document.querySelectorAll(".nav").forEach(b=>b.removeAttribute("aria-current"));
  const nv={campaign:"campaigns",wizard:"campaigns"}[S.view]||S.view;
  const cur=document.querySelector(`.nav[data-go="${nv}"]`);if(cur)cur.setAttribute("aria-current","page");
  $("#top").innerHTML=topbar();
  $("#main").innerHTML=V[S.view]();
  const bq=$("#b-queue");bq.textContent=queue.length||"";bq.hidden=!queue.length;
  if(S.view==="campaign"&&S.ctab==="messages")updEditor();
  save();
}
function updEditor(){
  const ta=$("#tpl");if(!ta)return;const text=ta.value;const kind=STEP_KIND[S.step];
  const filled=fill(text,{hitap:"Elif Demirtaş",kurum:"Özel Örnek Hastanesi"});const lim=kind==="invite"?300:8000;
  $("#len").innerHTML=`<span class="${filled.length>lim?"over":""}">${filled.length} / ${lim} karakter</span>`;
  $("#checks").innerHTML=rules(text,kind).map(c=>`<li><span class="dot ${c.ok?"ok":"no"}"></span>${esc(c.msg)}</li>`).join("");
  $("#prev").textContent=filled;
  $("#sugg").innerHTML=S.sugg?S.sugg.map((s,i)=>`<div class="sugg"><div class="row between"><span class="help">${esc(s.w)}</span><span class="tag t-mute">Örnek öneri</span></div><div class="diff" style="margin-top:8px">${wordDiff(text,s.t)}</div><div class="row" style="margin-top:10px"><button class="btn sm primary" data-use="${i}">Kullan</button>${i===S.sugg.length-1?`<button class="btn sm quiet" id="rej">Kapat</button>`:""}</div></div>`).join(""):"";
}
function setText(t,note){const c=camp();c.segments[S.seg][S.step]=t;const vl=vlist();if(vl[0].st!=="Taslak")vl.unshift({v:vl[0].v+1,st:"Taslak",note,sent:null,rate:null});else vl[0].note=note}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.go){S.view=d.go;S.sugg=null;if(d.dtab)S.disc=d.dtab;if(d.go==="wizard")S.wiz=1;render();if(d.toast)toast(d.toast);return}
  if(d.camp){S.camp=d.camp;S.view="campaign";S.ctab=d.ctab||"flow";if(d.seg)S.seg=d.seg;S.sugg=null;render();return}
  if(d.ctab){S.ctab=d.ctab;if(d.seg)S.seg=d.seg;S.sugg=null;render();return}
  if(d.dtab){S.disc=d.dtab;render();return}
  if(d.wiz){S.view="wizard";S.wiz=+d.wiz;render();return}
  if(d.step){S.step=d.step;S.sugg=null;render();return}
  if(d.seg){S.seg=d.seg;S.sugg=null;render();return}
  if(d.msg){S.step=d.msg;S.ctab="messages";S.sugg=null;render();return}
  if(d.attach){const st=camp().steps[d.attach];const i=files.findIndex(f=>f.id===st.file);st.file=files[(i+1)%files.length].id;render();toast(`Belge: ${files.find(f=>f.id===st.file).name}`);return}
  if(d.pause){const c=campaigns.find(x=>x.id===d.pause);c.status=c.status==="Duraklatıldı"?"Aktif":"Duraklatıldı";render();toast(`${c.name}: ${c.status.toLocaleLowerCase("tr-TR")}`);return}
  if(d.pf){S.pf=d.pf;render();return}
  if(d.person){S.prv=S.prv===+d.person+1?0:+d.person+1;render();return}
  if(d.pok){people[+d.pok].stage="Sırada";people[+d.pok].next="Profil ziyareti · yarın";render();toast("Uygun işaretlendi; benzer kurumlar için de hatırlanacak");return}
  if(d.pskip){people[+d.pskip].stage="Atlandı";people[+d.pskip].next="—";render();toast("Atlandı; bu kişiye bir şey gönderilmeyecek");return}
  if(d.rmacc){campaigns[0].accounts.splice(+d.rmacc,1);render();return}
  if(d.rm){const arr=d.rm in settings?settings[d.rm]:camp()[d.rm];arr.splice(+d.i,1);render();return}
  if(d.var){const ta=$("#tpl");const p=ta.selectionStart;ta.value=ta.value.slice(0,p)+d.var+ta.value.slice(ta.selectionEnd);setText(ta.value,"Elle düzenlendi");ta.focus();updEditor();return}
  if(d.ai){S.sugg=aiSuggest(d.ai,$("#tpl").value);updEditor();return}
  if(d.use){setText(S.sugg[+d.use].t,"Öneriden");S.sugg=null;render();toast("Taslak sürüm oluştu; onaylayınca gönderimde kullanılır");return}
  if(t.id==="rej"){S.sugg=null;updEditor();return}
  if(t.id==="approve"){const bad=rules($("#tpl").value,STEP_KIND[S.step]).filter(c=>!c.ok);if(bad.length){toast(`Onaylanamaz: ${bad[0].msg}`);return}const vl=vlist();if(vl[0].st==="Taslak"){vl.forEach(x=>{if(x.st==="Onaylı")x.st="Arşiv"});vl[0].st="Onaylı"}render();toast(`Sürüm ${vl[0].v} onaylandı`);return}
  if(d.approve||d.skip){const i=queue.findIndex(q=>q.id===+(d.approve||d.skip));const q=queue.splice(i,1)[0];render();toast(d.approve?`${q.p}: gönderim sırasına alındı`:`${q.p} atlandı`);return}
  if(d.approveall){const n=queue.length;queue.length=0;render();toast(`${n} mesaj gönderim sırasına alındı`);return}
  if(d.conv){S.conv=+d.conv;render();return}
  if(d.smode){if(d.smode==="manual"&&sched.mode!=="manual"){const p=plan();sched.days.forEach((x,i)=>{if(x.on)x.inv=p[i]})}if(d.smode==="auto"){sched.weekly=Math.min(200,plan().reduce((a,b)=>a+b,0)||180);sched.days.forEach(x=>{delete x.inv})}sched.mode=d.smode;render();return}
  if(d.preset){
    if(d.preset==="weekdays")sched.days.forEach((x,i)=>{x.on=i<5});
    if(d.preset==="all")sched.days.forEach(x=>{x.on=true;if(!x.w.length)x.w=[W("09:00","18:30")]});
    if(d.preset==="copy"){const m=sched.days[0];sched.days.forEach((x,i)=>{if(i&&x.on){x.w=m.w.map(w=>({...w}));if(sched.mode==="manual")x.inv=m.inv}})}
    render();toast("Zamanlama güncellendi; kaydetmeyi unutmayın");return}
  if(d.wadd){const day=sched.days[+d.wadd];const last=day.w.at(-1);const s=last?Math.min(23*60,(tmin(last.b)??600)+60):540;const f=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;day.w.push(W(f(s),f(Math.min(23*60+59,s+120))));render();return}
  if(d.wdel){const [i,k]=d.wdel.split("-").map(Number);sched.days[i].w.splice(k,1);render();return}
  if(d.dauto){delete sched.days[+d.dauto].inv;render();return}
  if(t.id==="saveSched"){toast("Davet zamanlaması kaydedildi");return}
  if(d.toast)toast(d.toast);
});
document.addEventListener("change",e=>{
  const x=e.target,d=x.dataset;
  if(d.don){sched.days[+d.don].on=x.checked;render();return}
  if(d.wa||d.wb){const [i,k]=(d.wa||d.wb).split("-").map(Number);sched.days[i].w[k][d.wa?"a":"b"]=x.value.trim();render();return}
  if(d.dinv!==undefined){const v=x.value.trim();if(v==="")delete sched.days[+d.dinv].inv;else sched.days[+d.dinv].inv=Math.max(0,+v);render();return}
  if(x.id==="wk"){sched.weekly=Math.max(0,+x.value||0);render();return}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="tpl"){setText(e.target.value,"Elle düzenlendi");const v=$("#vstat");if(v){v.textContent="Taslak";v.className="tag t-warn"}updEditor()}
  if(id==="share"){const v=+e.target.value;camp().share=v;$("#sharev").textContent="%"+v;$("#sharen").textContent=Math.round(180*v/100)}
  if(id.startsWith("w-")){const k=id.slice(2);camp().steps[k].delay=+e.target.value||1}
});
document.addEventListener("change",e=>{if(e.target.name==="rv"){camp().review=e.target.value;toast("Onay ayarı güncellendi")}if(e.target.id==="pdf"&&e.target.files[0]){const f=e.target.files[0];if(f.size>10*1024*1024){toast("Belge 10 MB'den büyük olamaz");return}files.push({id:"f"+(files.length+1),name:f.name,size:(f.size/1048576).toFixed(1).replace(".",",")+" MB",pages:"—",used:"—"});render();toast("Belge yüklendi")}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;
  if(f.id==="ask"){const q=$("#askq").value.trim();if(!q)return;S.sugg=aiSuggest("better",$("#tpl").value).map(s=>({...s,w:`İsteğiniz: "${q}". ${s.w}`}));updEditor();return}
  if(f.dataset.add){const v=f.querySelector("input").value.trim();if(!v)return;const k=f.dataset.add;(k in settings?settings[k]:camp()[k]).push(v);render();return}
  if(f.dataset.invite){const v=$("#inv").value.trim();if(v)toast(`${v} adresine davet gönderildi`)}
});
render();
</script>
