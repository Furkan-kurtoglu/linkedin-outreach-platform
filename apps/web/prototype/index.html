<title>HeAlthFintel Outreach Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Düzen: solda sabit menü, sağda çalışma alanı; telefonda menü üstte yatay şerit olur. */
:root{
  --bg:#f3f6f6; --surface:#ffffff; --sunk:#e9eff0; --line:#d5dfe1;
  --fg:#14262b; --muted:#5a6e73; --accent:#0d6b78; --accent-soft:#d8eef0; --on-accent:#ffffff;
  --good:#1f7a4a; --good-soft:#dcf1e4; --warn:#9a6200; --warn-soft:#fbeccc; --bad:#b3261e; --bad-soft:#fbe0dd;
  --add:#d9f0e1; --del:#fadcd8; --mine:#d8eef0;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#162226; --sunk:#1d2c31; --line:#2b3d42;
  --fg:#e3eef0; --muted:#97abb0; --accent:#4cc3d1; --accent-soft:#163d44; --on-accent:#08262b;
  --good:#5fd08f; --good-soft:#163b27; --warn:#f0b54a; --warn-soft:#3d2e10; --bad:#ff8a80; --bad-soft:#44201d;
  --add:#173d27; --del:#46201c; --mine:#163d44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#162226; --sunk:#1d2c31; --line:#2b3d42;
  --fg:#e3eef0; --muted:#97abb0; --accent:#4cc3d1; --accent-soft:#163d44; --on-accent:#08262b;
  --good:#5fd08f; --good-soft:#163b27; --warn:#f0b54a; --warn-soft:#3d2e10; --bad:#ff8a80; --bad-soft:#44201d;
  --add:#173d27; --del:#46201c; --mine:#163d44; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-family:var(--display);font-weight:700;font-size:19px;padding:4px 10px 18px;letter-spacing:-.01em}
.brand small{display:block;font:500 12px var(--body);color:var(--muted);letter-spacing:0}
.nav-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav-btn:hover{background:var(--sunk);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font:500 12px var(--mono);background:var(--sunk);color:var(--fg);border-radius:20px;padding:1px 8px}
.count.hot{background:var(--accent);color:var(--on-accent)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.side-foot button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:12px;text-align:left}
main{padding-block:28px 56px;padding-inline:clamp(16px,3vw,40px);min-width:0;max-width:1240px}
.demo{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:20px;padding:3px 10px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:8px 0 4px;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0}
.sub{color:var(--muted);margin:0 0 22px;max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.grid{display:grid;gap:16px}
.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font:500 28px var(--mono);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.meter{height:8px;background:var(--sunk);border-radius:8px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;margin-top:8px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:12px;color:var(--muted)}
.week .bar{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent-soft);position:relative}
.week .bar i{position:absolute;inset:auto 0 0 0;background:var(--accent);border-radius:6px 6px 2px 2px}
.week .today{color:var(--fg);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-info{background:var(--accent-soft);color:var(--accent)}.p-mute{background:var(--sunk);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.sm{font-size:13px;padding:4px 9px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border:0}
.feed time{font:500 12px var(--mono);color:var(--muted);min-width:44px;padding-top:2px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:14px}
.alert.warn{background:var(--warn-soft)}.alert.bad{background:var(--bad-soft)}.alert.info{background:var(--accent-soft)}
.alert b{display:block}
.agent{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:start}
.agent p{margin:2px 0 0;color:var(--muted);font-size:13px}
.agent .nums{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.agent .nums b{display:block;font:500 18px var(--mono);color:var(--fg)}
/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.hint{font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=email],select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);width:100%;min-width:0}
textarea{min-height:210px;resize:vertical;border-radius:10px;padding:12px;line-height:1.55}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:20px;padding:3px 6px 3px 10px;font-size:13px}
.chip button{border:0;background:none;padding:0 4px;color:var(--muted);font-size:15px;line-height:1}
.chip.ex{background:var(--bad-soft)}
.chip-add{display:flex;gap:6px;margin-top:6px}
.chip-add input{max-width:260px}
.choice{display:flex;flex-direction:column;gap:8px}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice small{display:block;color:var(--muted)}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 12px var(--mono)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer}
.days label:has(input:checked){background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.days input{position:absolute;opacity:0;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border:0}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
/* stüdyo */
.studio{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.meta .over{color:var(--bad);font-weight:600}
.vars{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.var{font:500 12px var(--mono);border:1px dashed var(--line);border-radius:6px;padding:2px 7px;background:none}
.ai{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.ai .btn{font-size:13px;padding:6px 10px}
.ask{display:flex;gap:8px;margin-top:8px}
.ask input{flex:1}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks li{display:flex;gap:8px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.dot.ok{background:var(--good)}.dot.no{background:var(--bad)}.dot.wait{background:var(--warn)}
.preview{background:var(--sunk);border-radius:10px;padding:14px;white-space:pre-wrap;font-size:14px}
.preview .who{font-size:12px;color:var(--muted);margin-bottom:6px;white-space:normal}
.suggest{border:1px solid var(--accent);border-radius:10px;padding:14px;margin-top:14px;background:var(--surface)}
.alt{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.diff{white-space:pre-wrap;font-size:14px;line-height:1.6}
.diff del{background:var(--del);text-decoration:line-through;border-radius:3px}
.diff ins{background:var(--add);text-decoration:none;border-radius:3px}
.why{font-size:13px;color:var(--muted);margin:8px 0 10px}
.vlist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.vlist li{display:flex;justify-content:space-between;gap:8px;align-items:center}
/* kuyruk, gelen kutusu */
.queue-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px}
.queue-item>textarea{grid-column:1/-1;min-height:90px}
.thread{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg{max-width:min(560px,90%);padding:10px 12px;border-radius:12px;font-size:14px;white-space:pre-wrap}
.msg.them{background:var(--sunk);align-self:flex-start}
.msg.me{background:var(--mine);align-self:flex-end}
.msg small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.inbox{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}
.conv{display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:none;padding:10px;border-radius:10px;width:100%}
.conv[aria-current="true"]{background:var(--accent-soft)}
.conv span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* giriş */
.login{max-width:400px;margin:8vh auto;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.wiz-step{font:600 12px var(--mono);color:var(--accent)}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  nav.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:6px 10px 6px 0;font-size:16px;white-space:nowrap}.brand small{display:none}
  .side-foot{display:none}
  .nav-btn{white-space:nowrap}
  .cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols-2,.cols-3,.studio,.inbox{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.nav-btn,.btn,.tab{transition:background .15s,color .15s,border-color .15s}}
</style>

<div class="app" id="app">

</div>

function check(text,kind){
  const low=text.toLocaleLowerCase("tr-TR");const out=[];
  const banned=settings.banned.filter(p=>p&&low.includes(p.toLocaleLowerCase("tr-TR")));
  out.push({ok:!banned.length,msg:banned.length?`Yasak ifade: "${banned[0]}"`:"Yasak ifade yok"});
  const ex=settings.excluded.filter(c=>low.includes(c.toLocaleLowerCase("tr-TR")));
  out.push({ok:!ex.length,msg:ex.length?`Hariç tutulan kurum geçiyor: ${ex[0]}`:"Hariç tutulan kurum geçmiyor"});
  out.push({ok:/^(Merhaba|Bağlantı için teşekkürler) \{ad_soyad\}/.test(text),msg:"Ad soyadla hitap"});
  const missing=[...text.matchAll(/\{([a-z_]+)\}/g)].map(m=>m[1]).filter(k=>!(k in SAMPLE));
  out.push({ok:!missing.length,msg:missing.length?`Bilinmeyen değişken: {${missing[0]}}`:"Tüm değişkenler dolduruluyor"});
  out.push({ok:!/\b\d+\s*dakika/i.test(text),msg:"Görüşme için süre belirtilmemiş"});
  if(kind==="invite"){const n=fill(text,SAMPLE).length;out.push({ok:n<=300,msg:`Davet notu ${n}/300 karakter (Premium)`})}
  else out.push({ok:text.includes(LINK),msg:"Web sitesi linki var"});
  return out;
}

function wordDiff(a,b){
  const A=a.split(/(\s+)/),B=b.split(/(\s+)/);const n=A.length,m=B.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out="";
  while(i<n&&j<m){if(A[i]===B[j]){out+=esc(A[i]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){out+=`<del>${esc(A[i])}</del>`;i++}else{out+=`<ins>${esc(B[j])}</ins>`;j++}}
  while(i<n)out+=`<del>${esc(A[i++])}</del>`;while(j<m)out+=`<ins>${esc(B[j++])}</ins>`;
  return out;
}

/* ---------- Çizim ve olaylar ---------- */
function render(){
  const isLogin=state.view==="login";
  $("nav.side").hidden=isLogin;$("#app").style.gridTemplateColumns=isLogin?"1fr":"";
  document.querySelectorAll(".nav-btn").forEach(b=>b.removeAttribute("aria-current"));
  const navv={agentEdit:"agents",wizard:"agents"}[state.view]||state.view;
  const cur=document.querySelector(`.nav-btn[data-view="${navv}"]`);if(cur)cur.setAttribute("aria-current","page");
  $("#main").innerHTML=views[state.view]();
  $("#qcount").textContent=queue.length||"";$("#qcount").hidden=!queue.length;
  $("#pcount").textContent=people.length;
  if(state.view==="studio")updateStudio();
  window.scrollTo(0,0);
}
function updateStudio(){
  const text=$("#tpl").value;const filled=fill(text,SAMPLE);const lim=state.kind==="invite"?300:8000;
  $("#len").innerHTML=`<span class="${filled.length>lim?"over":""}">${filled.length} / ${lim} karakter</span>`;
  $("#checks").innerHTML=check(text,state.kind).map(c=>`<li><span class="dot ${c.ok?"ok":"no"}"></span>${esc(c.msg)}</li>`).join("");
  $("#prev").innerHTML=`<div class="who">${SAMPLE.ad_soyad} · ${SAMPLE.kurum} (örnek kişi)</div>${esc(filled)}`;
  const s=state.suggestion;
  if(!s){$("#sugg").innerHTML="";return}
  if(s.alts){$("#sugg").innerHTML=`<div class="suggest"><div class="row between"><b>3 alternatif</b><span class="pill p-info">Örnek</span></div>${s.alts.map((a,i)=>`<div class="alt"><p class="why" style="margin:0 0 6px">${esc(a.why)}</p><div class="diff">${wordDiff(text,a.t)}</div><button class="btn sm" style="margin-top:8px" data-alt="${i}">Bunu kullan</button></div>`).join("")}<div class="row" style="margin-top:10px"><button class="btn ghost" id="rej">Kapat</button></div></div>`;return}
  $("#sugg").innerHTML=`<div class="suggest"><div class="row between"><b>Yapay zekâ önerisi</b><span class="pill p-info">Örnek</span></div>
    <p class="why">${esc(s.why)}</p><div class="diff">${wordDiff(text,s.text)}</div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="acc">Öneriyi uygula</button><button class="btn" id="rej">Reddet</button></div></div>`;
}
function newDraft(text,note){templates[state.seg][state.kind]=text;const vl=vlist();if(vl[0].status!=="Taslak")vl.unshift({v:vl[0].v+1,status:"Taslak",note});else vl[0].note=note;state.suggestion=null;render()}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.view){state.view=d.view;state.suggestion=null;try{localStorage.setItem("hfo-view",d.view==="login"?"overview":d.view)}catch(_){}render();if(d.toast)toast(d.toast);return}
  if(d.wizard){state.view="wizard";state.wiz=+d.wizard;render();return}
  if(d.edit){state.agent=d.edit;state.view="agentEdit";render();return}
  if(d.studio){state.seg=d.studio;state.kind="invite";state.view="studio";render();return}
  if(d.studiok){state.seg=state.agent;state.kind=d.studiok;state.view="studio";render();return}
  if(d.pause){const a=agents.find(x=>x.id===d.pause);a.status=a.status==="Duraklatıldı"?"Aktif":"Duraklatıldı";render();toast(`${a.name}: ${a.status.toLocaleLowerCase("tr-TR")}`);return}
  if(d.seg){state.seg=d.seg;state.suggestion=null;render();return}
  if(d.kind){state.kind=d.kind;state.suggestion=null;render();return}
  if(d.pf){state.pfilter=d.pf;render();return}
  if(d.pok){people[+d.pok].stage="Sırada";render();toast("Kişi uygun işaretlendi, sıraya alındı");return}
  if(d.pskip){people[+d.pskip].stage="Atlandı";render();toast("Kişi atlandı; ona hiçbir şey gönderilmeyecek");return}
  if(d.pex){const p=people[+d.pex];if(!settings.excluded.includes(p.o))settings.excluded.push(p.o);people.forEach(x=>{if(x.o===p.o)x.stage="Elendi"});render();toast(`${p.o} hariç tutma listesine eklendi`);return}
  if(d.rm){const arr=d.rm in settings?settings[d.rm]:agents.find(x=>x.id===state.agent)[d.rm];arr.splice(+d.i,1);render();return}
  if(d.var){const ta=$("#tpl");const p=ta.selectionStart;ta.value=ta.value.slice(0,p)+d.var+ta.value.slice(ta.selectionEnd);templates[state.seg][state.kind]=ta.value;ta.focus();updateStudio();return}
  if(d.ai){state.suggestion=fakeSuggest(d.ai,$("#tpl").value);updateStudio();return}
  if(d.alt){newDraft(state.suggestion.alts[+d.alt].t,"Alternatiflerden seçildi");toast("Taslak sürüm oluştu; onaylayınca gönderilmeye başlar");return}
  if(t.id==="acc"){newDraft(state.suggestion.text,"Yapay zekâ önerisi");toast("Taslak sürüm oluştu; onaylayınca gönderilmeye başlar");return}
  if(t.id==="rej"){state.suggestion=null;updateStudio();return}
  if(t.id==="approve"){const vl=vlist();const bad=check($("#tpl").value,state.kind).filter(c=>!c.ok);if(bad.length){toast(`Onaylanamaz: ${bad[0].msg}`);return}if(vl[0].status==="Taslak"){vl.forEach(x=>{if(x.status==="Onaylı")x.status="Arşiv"});vl[0].status="Onaylı"}render();toast(`v${vl[0].v} onaylandı; yeni gönderimler bu sürümle yapılır`);return}
  if(d.approve||d.skip){const id=+(d.approve||d.skip);const i=queue.findIndex(q=>q.id===id);const q=queue.splice(i,1)[0];render();toast(d.approve?`${q.name}: gönderim sırasına alındı`:`${q.name} atlandı`);return}
  if(d.approveall){const n=queue.length;queue.length=0;render();toast(`${n} mesaj gönderim sırasına alındı`);return}
  if(d.conv){state.conv=+d.conv;render();return}
  if(d.toast)toast(d.toast);
});
document.addEventListener("input",e=>{
  if(e.target.id==="tpl"){templates[state.seg][state.kind]=e.target.value;const vl=vlist();if(vl[0].status!=="Taslak"){vl.unshift({v:vl[0].v+1,status:"Taslak",note:"Elle düzenlendi"});const vs=$("#vstat");if(vs){vs.textContent="Taslak";vs.className="pill p-warn"}}updateStudio()}
  if(e.target.id==="share"){const v=+e.target.value;agents.find(x=>x.id===state.agent).share=v;$("#sharev").textContent="%"+v;$("#sharen").textContent=Math.round(180*v/100)}
});
document.addEventListener("change",e=>{if(e.target.name==="rv"){agents.find(x=>x.id===state.agent).review=e.target.value;toast("Onay modu güncellendi")}});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="ask"){const q=$("#askq").value.trim();if(!q)return;const s=fakeSuggest("better",$("#tpl").value);s.why=`İsteğiniz: "${q}". ${s.why}`;state.suggestion=s;updateStudio();return}
  if(f.dataset.add){const inp=f.querySelector("input");const v=inp.value.trim();if(!v)return;const key=f.dataset.add;const arr=key in settings?settings[key]:agents.find(x=>x.id===state.agent)[key];arr.push(v);render();return}
  if(f.dataset.invite){const v=$("#inv").value.trim();if(v)toast(`${v} adresine davet gönderildi`);return}
});
render();
</script>
