name: Kilit dosyası üret

# Bağımlılıklar değiştiğinde pnpm-lock.yaml dosyasını üretip depoya ekler (Vercel pnpm'i bu dosyadan tanır).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["**/package.json", "pnpm-workspace.yaml"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "pnpm kilit dosyası güncellendi"
          git push
