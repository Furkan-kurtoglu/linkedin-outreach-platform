name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: golge
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_PRISMA_URL: postgresql://user:pass@localhost:5432/db
      POSTGRES_URL_NON_POOLING: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Veritabanı şemasını doğrula
        run: pnpm --filter @hfo/db validate
      - name: Göçler boş veritabanına uygulanır ve şemayla birebir uyar
        working-directory: packages/db
        env:
          POSTGRES_PRISMA_URL: postgresql://postgres:golge@localhost:5432/postgres
          POSTGRES_URL_NON_POOLING: postgresql://postgres:golge@localhost:5432/postgres
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-url "$POSTGRES_URL_NON_POOLING" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Çekirdek testleri
        run: pnpm --filter @hfo/core test
      - name: Çekirdek tip kontrolü
        run: pnpm --filter @hfo/core typecheck
      - name: Panel tip kontrolü
        run: |
          set -o pipefail
          pnpm --filter @hfo/web exec tsc --noEmit --pretty false | tee /tmp/tsc.txt || {
            sed -E 's/^(.*)\(([0-9]+),([0-9]+)\): error (TS[0-9]+): (.*)$/::error file=apps\/web\/\1,line=\2,col=\3::\4 \5/' /tmp/tsc.txt
            exit 1
          }
      - name: Panel derleme
        run: pnpm --filter @hfo/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ornek.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Çalışan tip kontrolü
        if: hashFiles('apps/runner/package.json') != ''
        run: pnpm --filter @hfo/runner typecheck
